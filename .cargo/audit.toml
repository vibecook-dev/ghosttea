[advisories]
# fontdb 0.23.0 is the latest release and still uses ttf-parser for font
# discovery. RUSTSEC-2026-0192 is an unmaintained notice, not a known
# vulnerability; future ttf-parser advisories remain fatal. Revisit by
# 2026-10-23 or when fontdb publishes a maintained parser migration.
# Re-read 2026-10-23: fontdb 0.24.0 drops ttf-parser; the ghosttea-text move is its own lane.
ignore = ["RUSTSEC-2026-0192"]

[output]
deny = ["warnings"]
quiet = false
