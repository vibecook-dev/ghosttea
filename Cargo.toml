[workspace]
resolver = "2"
members = [
  "native/ghosttead",
  "native/ghosttea",
  "native/ghosttea/crates/ghosttea-apple-ffi",
  "native/ghosttea/crates/ghosttea-config",
  "native/ghosttea/crates/ghosttea-core",
  "native/ghosttea/crates/ghosttea-ffi",
  "native/ghosttea/crates/ghosttea-font-fixture-ffi",
  "native/ghosttea/crates/ghosttea-vt",
  "native/ghosttea/crates/ghosttea-vt-sys",
  "native/ghosttea/crates/ghosttea-text",
  "native/ghosttea/crates/ghosttea-truffle",
]

[workspace.package]
version = "0.12.0"
edition = "2024"
rust-version = "1.88"
authors = ["James Yong"]
license = "MIT"
repository = "https://github.com/vibecook-dev/ghosttea"

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
bytes = "1.10"
dotenvy = "0.15"
serde = { version = "1.0", features = ["derive"] }
rand = "0.9"
serde_json = "1.0"
sha2 = "0.10"
smallvec = "1.15"
subtle = "2"
tempfile = "3.20"
tokio = { version = "1.45", features = ["full"] }
uuid = { version = "1.16", features = ["v4"] }
truffle-core = "=0.7.12"

[patch.crates-io]
# Keep a newly introduced workspace crate packageable before its first
# crates.io release. Published consumers resolve the versioned dependency.
ghosttea-config = { path = "native/ghosttea/crates/ghosttea-config" }
