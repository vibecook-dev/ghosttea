[package]
name = "ghosttea-truffle"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Truffle transport adapter for Ghosttea"
readme = "README.md"

[features]
# The loopback compact host used by the cross-language interop run. Off by
# default: it serves whoever connects, with the tailnet identity check standing
# in rather than performed, so it must not be reachable from a shipped build.
interop-fixture = []

[[bin]]
name = "compact-interop-host"
required-features = ["interop-fixture"]

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
ghosttea = { version = "0.12.0", path = "../.." }
ghosttea-text = { version = "0.12.0", path = "../ghosttea-text" }
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle.workspace = true
tokio.workspace = true
truffle-core.workspace = true
uuid.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
dotenvy.workspace = true
tempfile.workspace = true
