[package]
name = "ghosttea"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "A native Ghostty-powered terminal runtime for Electron applications"
readme = "README.md"

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
bytes.workspace = true
portable-pty = "0.9"
ghosttea-vt = { version = "0.12.0", path = "crates/ghosttea-vt" }
ghosttea-config = { version = "0.12.0", path = "crates/ghosttea-config" }
ghosttea-core = { version = "0.12.0", path = "crates/ghosttea-core" }
ghosttea-text = { version = "0.12.0", path = "crates/ghosttea-text" }
serde.workspace = true
serde_json.workspace = true
subtle.workspace = true
tokio.workspace = true
uuid.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }

[dev-dependencies]
tempfile.workspace = true
