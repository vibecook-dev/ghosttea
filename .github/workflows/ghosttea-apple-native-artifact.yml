name: Ghosttea Apple native artifact

# The authoritative Apple binary is built by GitHub Actions from a reviewed
# commit. A manual dispatch may stop after producing a candidate, or—behind the
# protected release environment—publish that exact candidate under its
# content-addressed tag. A push to a release branch whose native sources no
# longer match the pinned artifact does both, then commits the pin. The
# scheduled job continuously verifies the artifact currently pinned by
# Package.swift.

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the CI-built candidate as a content-addressed GitHub release
        required: true
        type: boolean
        default: false
  pull_request:
    # Keep this list in sync with `nativeSourceInputs` in
    # scripts/ghosttea-apple-native-artifact.mjs. The manifest check verifies
    # that every provenance input is covered, so a release-version bump cannot
    # bypass the published-artifact audit again.
    paths:
      - ".github/workflows/ghosttea-apple-native-artifact.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "Package.swift"
      - "apple/GhostteaKit/Compatibility/ios-toolchain.lock.json"
      - "apple/GhostteaKit/Compatibility/apple-native-artifact.lock.json"
      - "native/fonts.lock.json"
      - "native/ghosttea/**"
      - "native/ghostty.lock.json"
      - "native/ssh.lock.json"
      - "scripts/build-ghosttea-apple-native.mjs"
      - "scripts/build-ghostty-vt-apple.mjs"
      - "scripts/ghostty-vt-target.mjs"
      - "scripts/build-ssh-candidate-apple.mjs"
      - "scripts/check-apple-native-artifact.mjs"
      - "scripts/ghosttea-apple-native-artifact.mjs"
      - "scripts/package-ghosttea-apple-native.mjs"
      - "scripts/verify-ghosttea-apple-native-package.mjs"
  schedule:
    - cron: "17 9 * * 1"
  # Every push to a release branch, with no path filter: release-needs compares
  # the tree's native source digest with the pin, so there is no second path
  # list to keep in sync with nativeSourceInputs.
  push:
    branches:
      - "release/*"

permissions:
  contents: read

concurrency:
  group: ghosttea-apple-native-${{ github.event_name }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  audit-published:
    if: github.event_name == 'schedule' || github.event_name == 'pull_request'
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci --ignore-scripts
      - run: npm run check:apple-native-artifact:release

      - name: Link every public product against the published artifact
        run: npm run test:swiftpm:consumer

  # A release branch needs a new artifact only when its native sources no longer
  # match the pinned one. The version bump does; the pin commit, a CHANGELOG
  # edit, or a branch that already carries its pin does not.
  release-needs:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      needed: ${{ steps.digest.outputs.needed }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - id: digest
        run: node scripts/pin-ghosttea-apple-native.mjs --needed

  build-candidate:
    needs: release-needs
    # A dispatch skips release-needs, hence `!cancelled()` rather than the
    # default, which would skip this job along with it.
    if: >-
      !cancelled() &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && needs.release-needs.outputs.needed == 'true'))
    runs-on: macos-26
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      GHOSTTY_DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    permissions:
      attestations: write
      contents: read
      id-token: write
    outputs:
      attestation_url: ${{ steps.attest.outputs.attestation-url }}
    steps:
      - name: Require the protected release branch for publication
        if: inputs.publish || github.event_name == 'push'
        env:
          DISPATCH_REF: ${{ github.ref }}
        run: |
          if [[ "$DISPATCH_REF" != refs/heads/release/* ]]; then
            echo "Apple artifact publication must be dispatched from a release/* branch; got $DISPATCH_REF." >&2
            exit 1
          fi

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - run: npm ci --ignore-scripts
      - run: npm run check:ios-release-toolchain

      - name: Build pinned Ghostty VT input
        run: |
          npm run bootstrap:ghostty-vt:apple
          npm run build:ghostty-vt:apple

      - name: Build pinned libssh2 and OpenSSL input
        run: |
          npm run bootstrap:ssh:apple
          npm run build:ssh:apple

      - run: npm run build:apple-native

      - name: Require clean candidate provenance
        run: |
          test \
            "$(node -p "require('./native/build/ghosttea-apple-native/metadata.json').sourceCommit")" \
            = "$GITHUB_SHA"
          test \
            "$(node -p "require('./native/build/ghosttea-apple-native/metadata.json').sourceDirty")" \
            = "false"

      - name: Run the complete SwiftPM suite against the candidate
        run: swift test --disable-sandbox --package-path apple/GhostteaKit

      - name: Link every public product against the candidate
        run: npm run test:swiftpm:consumer:local

      - run: npm run package:ghosttea-apple-native

      - name: Attach build provenance to the candidate
        run: >-
          cp
          native/build/ghosttea-apple-native/metadata.json
          artifacts/apple-native/GhostteaAppleNative.xcframework.zip.provenance.json

      - run: npm run verify:ghosttea-apple-native-package

      - id: attest
        name: Attest the qualified archive on its build runner
        uses: actions/attest@v4
        with:
          subject-path: artifacts/apple-native/GhostteaAppleNative.xcframework.zip

      - name: Verify the build-runner attestation
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh attestation verify
          artifacts/apple-native/GhostteaAppleNative.xcframework.zip
          --repo "$GITHUB_REPOSITORY"

      - name: Preserve the exact candidate for promotion
        uses: actions/upload-artifact@v7
        with:
          name: ghosttea-apple-native-candidate-${{ github.sha }}
          path: |
            artifacts/apple-native/GhostteaAppleNative.xcframework.zip
            artifacts/apple-native/GhostteaAppleNative.xcframework.zip.json
            artifacts/apple-native/GhostteaAppleNative.xcframework.zip.provenance.json
            native/build/ghosttea-apple-native/metadata.json
          if-no-files-found: error
          retention-days: 14

  publish-candidate:
    needs: build-candidate
    # Explicit about build-candidate for the same reason as its own condition:
    # a skipped release-needs upstream would otherwise skip this job too.
    if: >-
      !cancelled() &&
      needs.build-candidate.result == 'success' &&
      ((github.event_name == 'workflow_dispatch' && inputs.publish) || github.event_name == 'push')
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: actions/download-artifact@v8
        with:
          name: ghosttea-apple-native-candidate-${{ github.sha }}
          path: .

      - run: npm run verify:ghosttea-apple-native-package

      - name: Require the candidate to come from this workflow commit
        run: |
          test \
            "$(node -p "require('./native/build/ghosttea-apple-native/metadata.json').sourceCommit")" \
            = "$GITHUB_SHA"
          test \
            "$(node -p "require('./native/build/ghosttea-apple-native/metadata.json').sourceDirty")" \
            = "false"

      - id: candidate
        name: Read the verified content identity
        run: |
          result=artifacts/apple-native/GhostteaAppleNative.xcframework.zip.json
          {
            echo "tag=$(node -p "require('./${result}').tag")"
            echo "checksum=$(node -p "require('./${result}').checksum")"
            echo "source_digest=$(node -p "require('./${result}').sourceDigest")"
          } >> "$GITHUB_OUTPUT"

      - name: Verify the attestation before publishing
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh attestation verify
          artifacts/apple-native/GhostteaAppleNative.xcframework.zip
          --repo "$GITHUB_REPOSITORY"

      - name: Publish an append-only content-addressed release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.candidate.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; refusing to replace immutable bytes." >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" \
            artifacts/apple-native/GhostteaAppleNative.xcframework.zip \
            artifacts/apple-native/GhostteaAppleNative.xcframework.zip.json \
            artifacts/apple-native/GhostteaAppleNative.xcframework.zip.provenance.json \
            --target "$GITHUB_SHA" \
            --title "GhostteaAppleNative xcframework ${RELEASE_TAG#ghosttea-apple-native-}" \
            --notes "CI-built and attested from $GITHUB_REPOSITORY@$GITHUB_SHA." \
            --latest=false

      - name: Re-download and verify the served release bytes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.candidate.outputs.tag }}
        run: |
          mkdir verified-download
          gh release download "$RELEASE_TAG" \
            --pattern "GhostteaAppleNative.xcframework.zip*" \
            --dir verified-download
          npm run verify:ghosttea-apple-native-package -- verified-download

      - name: Record promotion result
        run: |
          {
            echo "### Published Ghosttea Apple native artifact"
            echo
            echo "- Tag: \`${{ steps.candidate.outputs.tag }}\`"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- SHA-256: \`${{ steps.candidate.outputs.checksum }}\`"
            echo "- Source digest: \`${{ steps.candidate.outputs.source_digest }}\`"
            echo "- Attestation: ${{ needs.build-candidate.outputs.attestation_url }}"
          } >> "$GITHUB_STEP_SUMMARY"

  # Writes the commit a release branch used to get by hand: the lock and
  # Package.swift moved to what publish-candidate just published. It audits the
  # pin the way a pull request's audit-published would and pushes it. A branch
  # that moved on in the meantime is left to the run for that newer push.
  #
  # The release PR is opened after this commit lands, and its checks then run on
  # the commit like on any other. GitHub holds a pull request's workflow runs
  # for a commit that github-actions pushed until a maintainer approves them,
  # as it did for 0.13.3's PR, opened before its pin. Gates dispatched from here
  # did not count for that PR, and repeat the checks of a PR opened later, so
  # this job starts none. If a PR is already open, the summary says to approve
  # its held runs.
  pin:
    needs:
      - build-candidate
      - publish-candidate
    if: >-
      !cancelled() &&
      github.event_name == 'push' &&
      needs.publish-candidate.result == 'success'
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    permissions:
      contents: write
      pull-requests: read
    steps:
      # The whole history, so the supersedes note can name the native inputs that
      # moved since the previous pin's source commit.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require the branch to still point at the built commit
        id: branch
        run: |
          set -euo pipefail
          git fetch --quiet origin "$GITHUB_REF"
          head="$(git rev-parse FETCH_HEAD)"
          if [ "$head" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "$GITHUB_REF_NAME moved to $head; the run for that push pins its own artifact."
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.branch.outputs.current == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - if: steps.branch.outputs.current == 'true'
        run: npm ci --ignore-scripts

      - if: steps.branch.outputs.current == 'true'
        uses: actions/download-artifact@v8
        with:
          name: ghosttea-apple-native-candidate-${{ github.sha }}
          path: .

      - name: Pin the published artifact
        if: steps.branch.outputs.current == 'true'
        env:
          ATTESTATION_URL: ${{ needs.build-candidate.outputs.attestation_url }}
        run: >-
          node scripts/pin-ghosttea-apple-native.mjs
          artifacts/apple-native/GhostteaAppleNative.xcframework.zip.json
          --run-url "$RUN_URL"
          --attestation-url "$ATTESTATION_URL"
          --source-commit "$GITHUB_SHA"
          --branch "$GITHUB_REF_NAME"

      - name: Audit the pin against the served artifact
        if: steps.branch.outputs.current == 'true'
        run: npm run check:apple-native-artifact:release

      - name: Link every public product against the pinned artifact
        if: steps.branch.outputs.current == 'true'
        run: npm run test:swiftpm:consumer

      - name: Commit the pin
        if: steps.branch.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          tag="$(node -p "require('./apple/GhostteaKit/Compatibility/apple-native-artifact.lock.json').tag")"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Package.swift apple/GhostteaKit/Compatibility/apple-native-artifact.lock.json
          git commit --quiet \
            --message "release: pin $version Apple native artifact" \
            --message "Pins $tag, built from $GITHUB_SHA and published by $RUN_URL."
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          pr="$(gh pr list --head "$GITHUB_REF_NAME" --state open --json number --jq '.[0].number // empty')"
          {
            echo "### Pinned $tag on $GITHUB_REF_NAME"
            echo
            echo "- Pin commit: \`$(git rev-parse HEAD)\`"
            if [ -n "$pr" ]; then
              echo "- PR #$pr was open before the pin, so GitHub holds its workflow runs for this commit."
              echo "  Approve them on the PR (Approve and run workflows) to start its checks."
            else
              echo "- Open the release PR for $GITHUB_REF_NAME now; its checks run on this commit."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$pr" ]; then
            echo "::warning title=Approve PR #$pr's held runs::GitHub holds its workflow runs for the pin commit until a maintainer approves them."
          fi
