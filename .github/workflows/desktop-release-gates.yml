name: Desktop release gates

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-release-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      GHOSTTY_DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      GHOSTTEA_SOAK_SESSIONS: ${{ github.event_name == 'schedule' && '1024' || '256' }}
      GHOSTTEA_SOAK_ROUNDS: ${{ github.event_name == 'schedule' && '4' || '1' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # Restores compiled dependencies saved by an earlier run on this branch or
      # on main. The key is the job, OS, rustc and the lockfile, and a moved
      # lockfile falls back to the newest cache for the same job and rustc.
      # Workspace crates always rebuild. Pull requests only read the cache, so
      # their entries never evict main's. ~/.cargo/bin stays out of it, so the
      # toolchain installed above is the one that runs.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name != 'pull_request' }}
          cache-bin: false

      - run: npm ci --ignore-scripts
      - run: npm run bootstrap:ghostty-vt:apple
      - run: npm run ci:desktop

  # Windows runs the same release gate as macOS. It bootstraps the Ghostty VT
  # artifact from the pinned source rather than the Apple prebuild, which is
  # also how a Windows contributor works today.
  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      GHOSTTEA_SOAK_SESSIONS: ${{ github.event_name == 'schedule' && '1024' || '256' }}
      GHOSTTEA_SOAK_ROUNDS: ${{ github.event_name == 'schedule' && '4' || '1' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # The same dependency cache as verify.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name != 'pull_request' }}
          cache-bin: false

      - run: npm ci --ignore-scripts
      - run: npm run bootstrap:ghostty-vt -- --target=x86_64-pc-windows-msvc

      # The source build of the pinned Ghostty VT library took about three
      # minutes of every run. It is reused while the lock, its patches, the build
      # scripts and the runner image are unchanged. A new image can move MSVC or
      # the Windows SDK, so it rebuilds from source, as does any change to what
      # the build reads. Only the install tree ghosttea-vt-sys links is kept, not
      # Zig's caches, and as with the Rust cache, pull requests only read it. The
      # bootstrap above still runs because ci:desktop syncs fonts from the
      # Ghostty checkout.
      - name: Key the Ghostty VT build
        id: vt-key
        run: |
          set -euo pipefail
          inputs="$(sha256sum native/ghostty.lock.json native/patches/* scripts/bootstrap-ghostty-vt.mjs \
            scripts/build-ghostty-vt.mjs scripts/ghostty-vt-target.mjs | sha256sum | cut -d' ' -f1)"
          image="${ImageOS:-unknown}-${ImageVersion:-unknown}"
          echo "key=ghostty-vt-x86_64-pc-windows-msvc-v1-$image-$inputs" >> "$GITHUB_OUTPUT"

      - name: Restore the Ghostty VT build
        id: vt
        uses: actions/cache/restore@v6
        with:
          key: ${{ steps.vt-key.outputs.key }}
          path: native/build/ghostty/x86_64-pc-windows-msvc/install

      - if: steps.vt.outputs.cache-hit != 'true'
        run: npm run build:ghostty-vt -- --target=x86_64-pc-windows-msvc

      - if: steps.vt.outputs.cache-hit != 'true' && github.event_name != 'pull_request'
        uses: actions/cache/save@v6
        with:
          key: ${{ steps.vt-key.outputs.key }}
          path: native/build/ghostty/x86_64-pc-windows-msvc/install

      - run: npm run ci:desktop

  minimum-rust:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@1.88.0
        id: toolchain

      # rust-cache keys on every installed toolchain, and the runner image ships
      # its own stable beside the pinned one. Removing it keeps the key to the
      # toolchain this job builds with, so an image update does not empty the
      # cache. The pinned toolchain is rustup's default, so nothing runs another.
      - name: Keep only the pinned toolchain
        env:
          PINNED: ${{ steps.toolchain.outputs.name }}
        run: |
          test -n "$PINNED" || { echo "dtolnay/rust-toolchain reported no toolchain name" >&2; exit 1; }
          for toolchain in $(rustup toolchain list --quiet); do
            case "$toolchain" in
              "$PINNED"-*) ;;
              *) rustup toolchain uninstall "$toolchain" ;;
            esac
          done

      # The same dependency cache as verify, separate because rustc differs.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name != 'pull_request' }}
          cache-bin: false

      - run: cargo check --workspace --all-targets --all-features --locked

  dependency-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high

      # RustSec's own release build, pinned by checksum. Compiling it with
      # `cargo install` took two to three minutes of every audit.
      - name: Install cargo-audit 0.22.2
        env:
          GH_TOKEN: ${{ github.token }}
          CARGO_AUDIT_ARCHIVE: cargo-audit-x86_64-unknown-linux-musl-v0.22.2
          CARGO_AUDIT_SHA256: 7fb9497f8594b389e5fce5ef9b92db08432996895b2e0c5a0167a69ed445c428
        run: |
          set -euo pipefail
          gh release download cargo-audit/v0.22.2 --repo rustsec/rustsec \
            --pattern "$CARGO_AUDIT_ARCHIVE.tgz" --dir "$RUNNER_TEMP"
          echo "$CARGO_AUDIT_SHA256  $RUNNER_TEMP/$CARGO_AUDIT_ARCHIVE.tgz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$CARGO_AUDIT_ARCHIVE.tgz" -C "$RUNNER_TEMP"
          install -m 0755 "$RUNNER_TEMP/$CARGO_AUDIT_ARCHIVE/cargo-audit" "$HOME/.cargo/bin/cargo-audit"

      - run: cargo audit
