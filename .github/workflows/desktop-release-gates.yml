name: Desktop release gates

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-release-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      GHOSTTY_DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      GHOSTTEA_SOAK_SESSIONS: ${{ github.event_name == 'schedule' && '1024' || '256' }}
      GHOSTTEA_SOAK_ROUNDS: ${{ github.event_name == 'schedule' && '4' || '1' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - run: npm ci --ignore-scripts
      - run: npm run bootstrap:ghostty-vt:apple
      - run: npm run ci:desktop

  # Windows runs the same release gate as macOS. It bootstraps the Ghostty VT
  # artifact from the pinned source rather than the Apple prebuild, which is
  # also how a Windows contributor works today.
  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      GHOSTTEA_SOAK_SESSIONS: ${{ github.event_name == 'schedule' && '1024' || '256' }}
      GHOSTTEA_SOAK_ROUNDS: ${{ github.event_name == 'schedule' && '4' || '1' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - run: npm ci --ignore-scripts
      - run: npm run bootstrap:ghostty-vt -- --target=x86_64-pc-windows-msvc
      - run: npm run build:ghostty-vt -- --target=x86_64-pc-windows-msvc
      - run: npm run ci:desktop

  minimum-rust:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@1.88.0

      - run: cargo check --workspace --all-targets --all-features --locked

  dependency-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high

      # RustSec's own release build, pinned by checksum. Compiling it with
      # `cargo install` took two to three minutes of every audit.
      - name: Install cargo-audit 0.22.2
        env:
          GH_TOKEN: ${{ github.token }}
          CARGO_AUDIT_ARCHIVE: cargo-audit-x86_64-unknown-linux-musl-v0.22.2
          CARGO_AUDIT_SHA256: 7fb9497f8594b389e5fce5ef9b92db08432996895b2e0c5a0167a69ed445c428
        run: |
          set -euo pipefail
          gh release download cargo-audit/v0.22.2 --repo rustsec/rustsec \
            --pattern "$CARGO_AUDIT_ARCHIVE.tgz" --dir "$RUNNER_TEMP"
          echo "$CARGO_AUDIT_SHA256  $RUNNER_TEMP/$CARGO_AUDIT_ARCHIVE.tgz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$CARGO_AUDIT_ARCHIVE.tgz" -C "$RUNNER_TEMP"
          install -m 0755 "$RUNNER_TEMP/$CARGO_AUDIT_ARCHIVE/cargo-audit" "$HOME/.cargo/bin/cargo-audit"

      - run: cargo audit
