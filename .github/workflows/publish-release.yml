name: Publish release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: publish-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-24.04
    outputs:
      release_tag: ${{ steps.target.outputs.release_tag }}
    steps:
      - name: Resolve the immutable release tag
        id: target
        env:
          TRIGGER_TAG: ${{ github.ref_name }}
        run: |
          release_tag="$TRIGGER_TAG"
          if [[ "$TRIGGER_TAG" =~ ^(v[0-9]+\.[0-9]+\.[0-9]+)-retry\.([1-9][0-9]*)$ ]]; then
            release_tag="${BASH_REMATCH[1]}"
          fi
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"

  rust-audit:
    needs: resolve
    if: startsWith(needs.resolve.outputs.release_tag, 'v')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.release_tag }}

      - uses: dtolnay/rust-toolchain@stable

      # RustSec's own release build, pinned by checksum. Compiling it with
      # `cargo install` took two to three minutes of every audit.
      - name: Install cargo-audit 0.22.2
        env:
          GH_TOKEN: ${{ github.token }}
          CARGO_AUDIT_ARCHIVE: cargo-audit-x86_64-unknown-linux-musl-v0.22.2
          CARGO_AUDIT_SHA256: 7fb9497f8594b389e5fce5ef9b92db08432996895b2e0c5a0167a69ed445c428
        run: |
          set -euo pipefail
          gh release download cargo-audit/v0.22.2 --repo rustsec/rustsec \
            --pattern "$CARGO_AUDIT_ARCHIVE.tgz" --dir "$RUNNER_TEMP"
          echo "$CARGO_AUDIT_SHA256  $RUNNER_TEMP/$CARGO_AUDIT_ARCHIVE.tgz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$CARGO_AUDIT_ARCHIVE.tgz" -C "$RUNNER_TEMP"
          install -m 0755 "$RUNNER_TEMP/$CARGO_AUDIT_ARCHIVE/cargo-audit" "$HOME/.cargo/bin/cargo-audit"

      - run: cargo audit

  # A tag on a commit that reached main has already passed the desktop gate:
  # desktop-release-gates.yml runs on every push to main, on macOS and Windows,
  # against that exact tree. This waits for that run instead of repeating it,
  # so the jobs that build what ships start at once.
  #
  # Anything short of a successful push run on main for this commit answers
  # false, and the desktop-gate jobs below run the suite here as this workflow
  # always did. That covers a tag on an older line's branch, a run that failed
  # or was cancelled by a newer push, a timeout, and an API error.
  main-gates:
    needs: resolve
    if: startsWith(needs.resolve.outputs.release_tag, 'v')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
    outputs:
      passed: ${{ steps.lookup.outputs.passed }}
    steps:
      - name: Wait for main's desktop gate on the release commit
        id: lookup
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
        run: |
          set -uo pipefail
          answer() {
            echo "passed=$1" >> "$GITHUB_OUTPUT"
            echo "$2"
            exit 0
          }

          if ! sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)"; then
            answer false "Could not resolve $RELEASE_TAG to a commit; the desktop gate runs here."
          fi
          runs="repos/$GITHUB_REPOSITORY/actions/workflows/desktop-release-gates.yml/runs"
          query="event=push&branch=main&head_sha=$sha&per_page=1"
          # A push run appears seconds after its push. A tag on an older line's
          # branch never gets one.
          appear_by=$((SECONDS + 180))
          # Inside this job's 60 minutes, so a slow run on main still leaves an
          # answer rather than a timeout.
          give_up_at=$((SECONDS + 55 * 60))
          while :; do
            if latest="$(gh api "$runs?$query" --jq '.workflow_runs[0] // empty | "\(.id) \(.status) \(.conclusion // "none")"')"; then
              if [ -z "$latest" ]; then
                if [ "$SECONDS" -ge "$appear_by" ]; then
                  answer false "No push run on main for $sha; the desktop gate runs here."
                fi
              else
                read -r id status conclusion <<< "$latest"
                if [ "$status" = completed ]; then
                  if [ "$conclusion" = success ]; then
                    answer true "Desktop release gates run $id passed on main for $sha."
                  fi
                  answer false "Desktop release gates run $id ended $conclusion for $sha; the desktop gate runs here."
                fi
                echo "Desktop release gates run $id is $status."
              fi
            else
              echo "The GitHub API did not answer; asking again."
            fi
            if [ "$SECONDS" -ge "$give_up_at" ]; then
              answer false "Main's desktop gate for $sha did not finish in time; the desktop gate runs here."
            fi
            sleep 30
          done

  validate:
    needs: resolve
    if: startsWith(needs.resolve.outputs.release_tag, 'v')
    runs-on: macos-26
    timeout-minutes: 75
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      GHOSTTY_DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.release_tag }}

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Require the package version to match the tag
        run: test "v$(node -p "require('./package.json').version")" = "$RELEASE_TAG"

      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high

      # The desktop gate covers the registry artifacts. It does not reach the
      # GhostteaKit native artifact, which ships to SwiftPM consumers through a
      # URL binary target rather than a registry — so before these two steps, a
      # release could publish a manifest whose artifact was missing, altered, or
      # built before the sources being tagged, and nothing here would object.
      #
      # This fetches the locked URL, hashes the archive, unpacks it, re-derives
      # the content and slice digests, and asserts the artifact was built from
      # this tree's native sources.
      - name: Verify the published Apple native artifact
        run: npm run check:apple-native-artifact:release

      - name: Run the complete published-artifact SwiftPM suite
        run: swift test --disable-sandbox

      # This is deliberately a separate package, resolved through the release
      # tag rather than as the repository root. It proves stable-version
      # resolution and links every public library product into one consumer.
      - name: Prove the exact tagged SwiftPM release links all public products
        run: node scripts/test-swiftpm-consumer.mjs --version "${RELEASE_TAG#v}"

      # The publish job runs on one platform, so every binary it publishes is
      # handed over as an artifact from the job that built it from the tag's
      # tree. This job contributes the macOS daemon and the universal native
      # tabs prebuild; `validate-windows` contributes the Windows daemon.
      #
      # ghosttea-text shapes with harfrust, which is Rust: the build compiles no
      # HarfBuzz and probes no pkg-config, so a runner that carries Homebrew's
      # formula cannot link the daemon against it. Before harfrust, harfbuzz-sys
      # probed first and this step had to set HARFBUZZ_SYS_NO_PKG_CONFIG (0.5.1).
      - run: cargo build --release --locked --package ghosttead

      # A self-contained daemon is a property that regresses silently, so assert
      # it: a released daemon depends on nothing a consumer has
      # to install. This gates every -sys crate that could do the same thing,
      # not only harfbuzz, and it fails on the builder rather than on a user's
      # machine — which running the daemon here cannot, because the library it
      # would be missing is the one this runner provides.
      - name: Require the daemon to link only system libraries
        run: |
          set -euo pipefail
          foreign=$(otool -L target/release/ghosttead \
            | grep -E '^[[:space:]]' \
            | grep -vE '^[[:space:]]+(/System/|/usr/lib/)' || true)
          if [ -n "$foreign" ]; then
            echo "ghosttead links libraries a consumer would have to install:"
            echo "$foreign"
            exit 1
          fi

      - run: npm run build:ghosttea-native-tabs

      - uses: actions/upload-artifact@v7
        with:
          name: ghosttead-darwin-arm64
          path: target/release/ghosttead
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: ghosttea-native-tabs
          path: packages/ghosttea-native-tabs/prebuilds/ghosttea_native_tabs.node
          if-no-files-found: error

  # The published crates and packages support Windows, so a release that only
  # builds on macOS can ship a target it never built. This builds the Windows
  # daemon from the tag's tree, with the Ghostty VT artifact built from the
  # pinned source as the desktop workflow does. Its desktop gate is main's
  # windows job for this commit, or desktop-gate-windows below.
  validate-windows:
    needs: resolve
    if: startsWith(needs.resolve.outputs.release_tag, 'v')
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.release_tag }}

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Require the package version to match the tag
        run: test "v$(node -p "require('./package.json').version")" = "$RELEASE_TAG"

      - run: npm ci --ignore-scripts
      - run: npm run bootstrap:ghostty-vt -- --target=x86_64-pc-windows-msvc
      - run: npm run build:ghostty-vt -- --target=x86_64-pc-windows-msvc

      # Nothing in this build probes pkg-config, as on macOS.
      - run: cargo build --release --locked --package ghosttead

      - uses: actions/upload-artifact@v7
        with:
          name: ghosttead-win32-x64
          path: target/release/ghosttead.exe
          if-no-files-found: error

  # The desktop release gate, for a release commit main has not already passed.
  # These are the steps the validate jobs used to run before building, on the
  # same runners.
  desktop-gate:
    needs:
      - resolve
      - main-gates
    if: >-
      startsWith(needs.resolve.outputs.release_tag, 'v') &&
      needs.main-gates.outputs.passed != 'true'
    runs-on: macos-26
    timeout-minutes: 75
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      GHOSTTY_DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.release_tag }}

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Require the package version to match the tag
        run: test "v$(node -p "require('./package.json').version")" = "$RELEASE_TAG"

      - run: npm ci --ignore-scripts
      - run: npm run bootstrap:ghostty-vt:apple
      - run: npm run ci:desktop

  desktop-gate-windows:
    needs:
      - resolve
      - main-gates
    if: >-
      startsWith(needs.resolve.outputs.release_tag, 'v') &&
      needs.main-gates.outputs.passed != 'true'
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.release_tag }}

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Require the package version to match the tag
        run: test "v$(node -p "require('./package.json').version")" = "$RELEASE_TAG"

      - run: npm ci --ignore-scripts
      - run: npm run bootstrap:ghostty-vt -- --target=x86_64-pc-windows-msvc
      - run: npm run build:ghostty-vt -- --target=x86_64-pc-windows-msvc
      - name: Run the desktop release gate
        run: |
          # A retry checks out the immutable release tree, not this workflow's
          # source commit. v0.10.0 predates the lazy Electron import and the
          # handle-based process-exit assertions below, so keep its pure unit
          # test offline and serialize its three job-object tests. Later tags
          # carry the source fixes and take the ordinary path.
          if [[ "$GITHUB_REF_NAME" == v0.10.0-retry.* ]]; then
            export ELECTRON_OVERRIDE_DIST_PATH="$RUNNER_TEMP"
            export RUST_TEST_THREADS=1
          fi
          npm run ci:desktop

  publish:
    needs:
      - resolve
      - rust-audit
      - main-gates
      - validate
      - validate-windows
      - desktop-gate
      - desktop-gate-windows
    # The desktop gate passed either on main for this commit or in the two jobs
    # above. `!cancelled()` lets this job run when those two were skipped
    # because main had passed, so every other result is checked here: a failed
    # job, or a gate skipped for any other reason, stops the release.
    if: >-
      !cancelled() &&
      startsWith(needs.resolve.outputs.release_tag, 'v') &&
      vars.OIDC_RELEASE_ENABLED == 'true' &&
      needs.rust-audit.result == 'success' &&
      needs.validate.result == 'success' &&
      needs.validate-windows.result == 'success' &&
      (needs.main-gates.outputs.passed == 'true' ||
      (needs.desktop-gate.result == 'success' && needs.desktop-gate-windows.result == 'success'))
    # npm provenance requires a GitHub-hosted runner.
    runs-on: macos-15
    # Most of this job is waiting for the registries to serve what it uploaded:
    # up to the budget below per crate and per layer of npm packages. A job
    # that times out fails like any other, and a re-run skips what the
    # registries already hold.
    timeout-minutes: 120
    environment: release
    env:
      RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
      # How long each publisher waits for an upload to become resolvable before
      # failing the release. npm took up to 4 minutes 9 seconds to serve a
      # 0.12.0 package, when the publishers still allowed about two and a half.
      # A retry tag runs this file with the release tag's scripts, so this is
      # where a retry would wait longer.
      REGISTRY_VISIBILITY_TIMEOUT_MINUTES: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.release_tag }}

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - uses: dtolnay/rust-toolchain@stable

      - name: Require the package version to match the tag
        run: test "v$(node -p "require('./package.json').version")" = "$RELEASE_TAG"

      - run: npm ci --ignore-scripts
      - run: npm run build:sdk

      - uses: actions/download-artifact@v8
        with:
          path: staging

      # Fails closed when any validate build is missing: a release with a
      # hole in it stops here, before the first registry mutation.
      - name: Stage the validate builds into the packages that publish them
        run: node scripts/stage-published-binaries.mjs staging

      - uses: rust-lang/crates-io-auth-action@v1
        id: auth-vt-sys
      - name: Publish ghosttea-vt-sys
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth-vt-sys.outputs.token }}
        run: scripts/publish-crate-if-missing.sh ghosttea-vt-sys

      - uses: rust-lang/crates-io-auth-action@v1
        id: auth-text
      - name: Publish ghosttea-text
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth-text.outputs.token }}
        run: scripts/publish-crate-if-missing.sh ghosttea-text

      - uses: rust-lang/crates-io-auth-action@v1
        id: auth-vt
      - name: Publish ghosttea-vt
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth-vt.outputs.token }}
        run: scripts/publish-crate-if-missing.sh ghosttea-vt

      - uses: rust-lang/crates-io-auth-action@v1
        id: auth-config
      - name: Publish ghosttea-config
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth-config.outputs.token }}
        run: scripts/publish-crate-if-missing.sh ghosttea-config

      - uses: rust-lang/crates-io-auth-action@v1
        id: auth-core
      - name: Publish ghosttea-core
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth-core.outputs.token }}
        run: scripts/publish-crate-if-missing.sh ghosttea-core

      - uses: rust-lang/crates-io-auth-action@v1
        id: auth-service
      - name: Publish ghosttea
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth-service.outputs.token }}
        run: scripts/publish-crate-if-missing.sh ghosttea

      - uses: rust-lang/crates-io-auth-action@v1
        id: auth-truffle
      - name: Publish ghosttea-truffle
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth-truffle.outputs.token }}
        run: scripts/publish-crate-if-missing.sh ghosttea-truffle

      # Every package the manifests publish, each once npm resolves the
      # workspace packages it depends on at this version, so
      # `@vibecook/ghosttead` can never exist at a version whose optional
      # dependencies do not. The order comes from the manifests; `--plan`
      # prints it.
      - name: Publish npm packages
        run: node scripts/publish-npm-packages.mjs

  # Creating the release used to be a manual step after this workflow finished,
  # and 0.4.0 shipped to both registries while the release page kept showing
  # 0.3.0. It runs after `publish` so the release never describes artifacts that
  # were not uploaded, and it is the only job granted `contents: write`.
  #
  # It deliberately does not request the `release` environment: `publish`
  # already cleared that gate, and asking again would stop a completed release
  # behind a second approval.
  #
  # `!cancelled()` and the explicit result keep it running when the desktop-gate
  # jobs upstream were skipped because main had already passed this commit.
  github-release:
    needs:
      - resolve
      - publish
    if: >-
      !cancelled() &&
      needs.publish.result == 'success' &&
      startsWith(needs.resolve.outputs.release_tag, 'v') &&
      vars.OIDC_RELEASE_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.release_tag }}

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      # No `npm ci`: the generator reads repository files and the Node standard
      # library, so a release cannot be blocked by dependency installation.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/create-release-if-missing.sh "$RELEASE_TAG"
