name: Publish release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: publish-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-24.04
    outputs:
      release_tag: ${{ steps.target.outputs.release_tag }}
    steps:
      - name: Resolve the immutable release tag
        id: target
        env:
          TRIGGER_TAG: ${{ github.ref_name }}
        run: |
          release_tag="$TRIGGER_TAG"
          if [[ "$TRIGGER_TAG" =~ ^(v[0-9]+\.[0-9]+\.[0-9]+)-retry\.([1-9][0-9]*)$ ]]; then
            release_tag="${BASH_REMATCH[1]}"
          fi
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"

  rust-audit:
    needs: resolve
    if: startsWith(needs.resolve.outputs.release_tag, 'v')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.release_tag }}

      - uses: dtolnay/rust-toolchain@stable

      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo audit

  validate:
    needs: resolve
    if: startsWith(needs.resolve.outputs.release_tag, 'v')
    runs-on: macos-26
    timeout-minutes: 75
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      GHOSTTY_DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.release_tag }}

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Require the package version to match the tag
        run: test "v$(node -p "require('./package.json').version")" = "$RELEASE_TAG"

      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - run: npm run bootstrap:ghostty-vt:apple
      - run: npm run ci:desktop

      # `ci:desktop` covers the registry artifacts. It does not reach the
      # GhostteaKit native artifact, which ships to SwiftPM consumers through a
      # URL binary target rather than a registry — so before these two steps, a
      # release could publish a manifest whose artifact was missing, altered, or
      # built before the sources being tagged, and nothing here would object.
      #
      # This fetches the locked URL, hashes the archive, unpacks it, re-derives
      # the content and slice digests, and asserts the artifact was built from
      # this tree's native sources.
      - name: Verify the published Apple native artifact
        run: npm run check:apple-native-artifact:release

      - name: Run the complete published-artifact SwiftPM suite
        run: swift test --disable-sandbox

      # This is deliberately a separate package, resolved through the release
      # tag rather than as the repository root. It proves stable-version
      # resolution and links every public library product into one consumer.
      - name: Prove the exact tagged SwiftPM release links all public products
        run: node scripts/test-swiftpm-consumer.mjs --version "${RELEASE_TAG#v}"

      # The publish job runs on one platform, so every binary it publishes is
      # handed over as an artifact from the job that could build and gate it.
      # This job contributes the macOS daemon and the universal native tabs
      # prebuild; `validate-windows` contributes the Windows daemon.
      #
      # harfbuzz-sys probes pkg-config unless this is set, and a runner that
      # happens to carry the Homebrew formula then links the daemon against a
      # prefix that exists only on the builder. Forcing the vendored source
      # makes the published binary the same one a developer machine without
      # that formula already produces.
      - run: cargo build --release --locked --package ghosttead
        env:
          HARFBUZZ_SYS_NO_PKG_CONFIG: "1"

      # The variable above is a fix that regresses silently, so assert the
      # property it buys: a released daemon depends on nothing a consumer has
      # to install. This gates every -sys crate that could do the same thing,
      # not only harfbuzz, and it fails on the builder rather than on a user's
      # machine — which running the daemon here cannot, because the library it
      # would be missing is the one this runner provides.
      - name: Require the daemon to link only system libraries
        run: |
          set -euo pipefail
          foreign=$(otool -L target/release/ghosttead \
            | grep -E '^[[:space:]]' \
            | grep -vE '^[[:space:]]+(/System/|/usr/lib/)' || true)
          if [ -n "$foreign" ]; then
            echo "ghosttead links libraries a consumer would have to install:"
            echo "$foreign"
            exit 1
          fi

      - run: npm run build:ghosttea-native-tabs

      - uses: actions/upload-artifact@v7
        with:
          name: ghosttead-darwin-arm64
          path: target/release/ghosttead
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: ghosttea-native-tabs
          path: packages/ghosttea-native-tabs/prebuilds/ghosttea_native_tabs.node
          if-no-files-found: error

  # The published crates and packages support Windows, so a release gate that
  # only runs on macOS can ship a target it never built. This runs the same
  # release gate there, building the Ghostty VT artifact from the pinned source
  # as the desktop workflow does.
  validate-windows:
    needs: resolve
    if: startsWith(needs.resolve.outputs.release_tag, 'v')
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.release_tag }}

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Require the package version to match the tag
        run: test "v$(node -p "require('./package.json').version")" = "$RELEASE_TAG"

      - run: npm ci --ignore-scripts
      - run: npm run bootstrap:ghostty-vt -- --target=x86_64-pc-windows-msvc
      - run: npm run build:ghostty-vt -- --target=x86_64-pc-windows-msvc
      - name: Run the desktop release gate
        run: |
          # A retry checks out the immutable release tree, not this workflow's
          # source commit. v0.10.0 predates the lazy Electron import and the
          # handle-based process-exit assertions below, so keep its pure unit
          # test offline and serialize its three job-object tests. Later tags
          # carry the source fixes and take the ordinary path.
          if [[ "$GITHUB_REF_NAME" == v0.10.0-retry.* ]]; then
            export ELECTRON_OVERRIDE_DIST_PATH="$RUNNER_TEMP"
            export RUST_TEST_THREADS=1
          fi
          npm run ci:desktop

      # Set for the same reason as the macOS build. Nothing on this runner
      # answers a pkg-config probe today, so the vendored source is already
      # what gets linked — this keeps that a decision rather than an accident.
      - run: cargo build --release --locked --package ghosttead
        env:
          HARFBUZZ_SYS_NO_PKG_CONFIG: "1"

      - uses: actions/upload-artifact@v7
        with:
          name: ghosttead-win32-x64
          path: target/release/ghosttead.exe
          if-no-files-found: error

  publish:
    needs:
      - resolve
      - rust-audit
      - validate
      - validate-windows
    if: >-
      startsWith(needs.resolve.outputs.release_tag, 'v') &&
      vars.OIDC_RELEASE_ENABLED == 'true'
    # npm provenance requires a GitHub-hosted runner.
    runs-on: macos-15
    # Most of this job is waiting for the registries to serve what it uploaded:
    # up to the budget below per crate and per layer of npm packages. A job
    # that times out stops behind another approval, like any other failure.
    timeout-minutes: 120
    environment: release
    env:
      RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
      # How long each publisher waits for an upload to become resolvable before
      # failing the release. npm took up to 4 minutes 9 seconds to serve a
      # 0.12.0 package, when the publishers still allowed about two and a half.
      # A retry tag runs this file with the release tag's scripts, so this is
      # where a retry would wait longer.
      REGISTRY_VISIBILITY_TIMEOUT_MINUTES: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.release_tag }}

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - uses: dtolnay/rust-toolchain@stable

      - name: Require the package version to match the tag
        run: test "v$(node -p "require('./package.json').version")" = "$RELEASE_TAG"

      - run: npm ci --ignore-scripts
      - run: npm run build:sdk

      - uses: actions/download-artifact@v8
        with:
          path: staging

      # Fails closed when any validate build is missing: a release with a
      # hole in it stops here, before the first registry mutation.
      - name: Stage the validate builds into the packages that publish them
        run: node scripts/stage-published-binaries.mjs staging

      - uses: rust-lang/crates-io-auth-action@v1
        id: auth-vt-sys
      - name: Publish ghosttea-vt-sys
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth-vt-sys.outputs.token }}
        run: scripts/publish-crate-if-missing.sh ghosttea-vt-sys

      - uses: rust-lang/crates-io-auth-action@v1
        id: auth-text
      - name: Publish ghosttea-text
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth-text.outputs.token }}
        run: scripts/publish-crate-if-missing.sh ghosttea-text

      - uses: rust-lang/crates-io-auth-action@v1
        id: auth-vt
      - name: Publish ghosttea-vt
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth-vt.outputs.token }}
        run: scripts/publish-crate-if-missing.sh ghosttea-vt

      - uses: rust-lang/crates-io-auth-action@v1
        id: auth-config
      - name: Publish ghosttea-config
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth-config.outputs.token }}
        run: scripts/publish-crate-if-missing.sh ghosttea-config

      - uses: rust-lang/crates-io-auth-action@v1
        id: auth-core
      - name: Publish ghosttea-core
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth-core.outputs.token }}
        run: scripts/publish-crate-if-missing.sh ghosttea-core

      - uses: rust-lang/crates-io-auth-action@v1
        id: auth-service
      - name: Publish ghosttea
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth-service.outputs.token }}
        run: scripts/publish-crate-if-missing.sh ghosttea

      - uses: rust-lang/crates-io-auth-action@v1
        id: auth-truffle
      - name: Publish ghosttea-truffle
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth-truffle.outputs.token }}
        run: scripts/publish-crate-if-missing.sh ghosttea-truffle

      # Every package the manifests publish, each once npm resolves the
      # workspace packages it depends on at this version, so
      # `@vibecook/ghosttead` can never exist at a version whose optional
      # dependencies do not. The order comes from the manifests; `--plan`
      # prints it.
      - name: Publish npm packages
        run: node scripts/publish-npm-packages.mjs

  # Creating the release used to be a manual step after this workflow finished,
  # and 0.4.0 shipped to both registries while the release page kept showing
  # 0.3.0. It runs after `publish` so the release never describes artifacts that
  # were not uploaded, and it is the only job granted `contents: write`.
  #
  # It deliberately does not request the `release` environment: `publish`
  # already cleared that gate, and asking again would stop a completed release
  # behind a second approval.
  github-release:
    needs:
      - resolve
      - publish
    if: >-
      startsWith(needs.resolve.outputs.release_tag, 'v') &&
      vars.OIDC_RELEASE_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.release_tag }}

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      # No `npm ci`: the generator reads repository files and the Node standard
      # library, so a release cannot be blocked by dependency installation.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/create-release-if-missing.sh "$RELEASE_TAG"
