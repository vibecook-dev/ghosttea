name: iOS release hardening

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".cargo/**"
      - ".github/workflows/ghosttea-apple-native-artifact.yml"
      - ".github/workflows/ios-release-hardening.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "Package.swift"
      - "apple/**"
      - "native/fonts.lock.json"
      - "native/ghosttea/**"
      - "native/ghostty.lock.json"
      - "native/ssh.lock.json"
      - "package-lock.json"
      - "package.json"
      - "scripts/**"
  push:
    branches:
      - main
    paths:
      - ".cargo/**"
      - ".github/workflows/ghosttea-apple-native-artifact.yml"
      - ".github/workflows/ios-release-hardening.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "Package.swift"
      - "apple/**"
      - "native/fonts.lock.json"
      - "native/ghosttea/**"
      - "native/ghostty.lock.json"
      - "native/ssh.lock.json"
      - "package-lock.json"
      - "package.json"
      - "scripts/**"

permissions:
  contents: read

jobs:
  validate-bom:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci --ignore-scripts
      - run: npm run check:ghostty-upgrade
      - run: npm run check:bundled-fonts
      - run: npm run check:ios-release-bom
      - run: npm run check:ios-release-resources
      - run: npm run check:ios-app-store
      - run: npm run check:ios-diagnostics

      - name: Validate with the official CycloneDX CLI
        uses: docker://cyclonedx/cyclonedx-cli:0.32.0
        with:
          args: >-
            validate
            --input-file apple/GhostteaKit/Compatibility/ios-release.cdx.json
            --input-format json
            --input-version v1_6
            --fail-on-errors

      - name: Preserve validated iOS release metadata
        uses: actions/upload-artifact@v7
        with:
          name: ghosttea-ios-release-metadata
          path: |
            apple/GhostteaApp/Resources/Ghosttea-iOS.cdx.json
            apple/GhostteaApp/Resources/THIRD-PARTY-NOTICES.txt
            apple/GhostteaKit/Compatibility/ios-release-resources.lock.json
            apple/GhostteaKit/Compatibility/ios-toolchain.lock.json
            apple/GhostteaKit/Compatibility/ios-app-store.lock.json
            apple/GhostteaKit/Compatibility/TailscaleKit-PrivacyInfo.xcprivacy
            apple/GhostteaKit/Compatibility/app-store-review-notes.md
            apple/GhostteaApp/Resources/PrivacyInfo.xcprivacy
          if-no-files-found: error

  # The root manifest publishes GhostteaKit and the local one builds it; they are
  # mirrors apart from how the native artifact is sourced. Comparing the two
  # package graphs needs a Swift toolchain to evaluate them, so it runs here
  # rather than on the Linux BOM job, where the check would silently skip.
  validate-package-manifests:
    runs-on: macos-26
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      GHOSTTY_DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@1.97.1
        id: toolchain
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      # As in the desktop gates' minimum-rust job: rust-cache keys on every
      # installed toolchain, so the image's own stable goes before it does.
      - name: Keep only the pinned toolchain
        env:
          PINNED: ${{ steps.toolchain.outputs.name }}
        run: |
          test -n "$PINNED" || { echo "dtolnay/rust-toolchain reported no toolchain name" >&2; exit 1; }
          for toolchain in $(rustup toolchain list --quiet); do
            case "$toolchain" in
              "$PINNED"-*) ;;
              *) rustup toolchain uninstall "$toolchain" ;;
            esac
          done

      # Restores the compiled dependencies of build:apple-native's three Apple
      # targets, with the same policy as the desktop gates: pull requests only
      # read the cache, workspace crates always rebuild, and ~/.cargo/bin stays
      # out of it. The publication build never uses this cache.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name != 'pull_request' }}
          cache-bin: false

      - run: npm ci --ignore-scripts
      - run: npm run check:ios-release-toolchain
      - run: npm run check:swiftpm:manifests

      # Build every native input from its reviewed lock, then produce one Rust
      # staticlib for the entire Swift package. This catches native/source drift
      # before a remote artifact exists for the reviewed source.
      - run: npm run bootstrap:ghostty-vt:apple
      - run: npm run build:ghostty-vt:apple
      - run: npm run bootstrap:ssh:apple
      - run: npm run build:ssh:apple
      - run: npm run build:apple-native

      - name: Run the complete local-artifact SwiftPM suite
        run: swift test --disable-sandbox --package-path apple/GhostteaKit

      - name: Link every public product against the candidate artifact
        run: npm run test:swiftpm:consumer:local

      - run: npm run package:ghosttea-apple-native
      - run: npm run verify:ghosttea-apple-native-package

      - name: Preserve the reviewed Apple native candidate
        uses: actions/upload-artifact@v7
        with:
          name: ghosttea-apple-native-candidate-${{ github.sha }}
          path: |
            artifacts/apple-native/GhostteaAppleNative.xcframework.zip
            artifacts/apple-native/GhostteaAppleNative.xcframework.zip.json
            native/build/ghosttea-apple-native/metadata.json
            native/build/ghostty-apple/build-metadata.json
            native/build/ssh-apple/build-metadata.json
          if-no-files-found: error
          retention-days: 14
