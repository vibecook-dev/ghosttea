name: iOS release hardening

on:
  workflow_dispatch:
    inputs:
      render_evidence:
        description: Render the font-parity rows through GhostteaMetalRenderer and upload the PNG
        type: boolean
        default: false
  pull_request:
    paths:
      - ".cargo/**"
      - ".github/workflows/ghosttea-apple-native-artifact.yml"
      - ".github/workflows/ios-release-hardening.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "Package.swift"
      - "apple/**"
      - "native/fonts.lock.json"
      - "native/ghosttea/**"
      - "native/ghostty.lock.json"
      - "native/ssh.lock.json"
      - "package-lock.json"
      - "package.json"
      - "scripts/**"
  push:
    branches:
      - main
    paths:
      - ".cargo/**"
      - ".github/workflows/ghosttea-apple-native-artifact.yml"
      - ".github/workflows/ios-release-hardening.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "Package.swift"
      - "apple/**"
      - "native/fonts.lock.json"
      - "native/ghosttea/**"
      - "native/ghostty.lock.json"
      - "native/ssh.lock.json"
      - "package-lock.json"
      - "package.json"
      - "scripts/**"

permissions:
  contents: read

jobs:
  validate-bom:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci --ignore-scripts
      - run: npm run check:ghostty-upgrade
      - run: npm run check:bundled-fonts
      - run: npm run check:ios-release-bom
      - run: npm run check:ios-release-resources
      - run: npm run check:ios-app-store
      - run: npm run check:ios-diagnostics

      - name: Validate with the official CycloneDX CLI
        uses: docker://cyclonedx/cyclonedx-cli:0.32.0
        with:
          args: >-
            validate
            --input-file apple/GhostteaKit/Compatibility/ios-release.cdx.json
            --input-format json
            --input-version v1_6
            --fail-on-errors

      - name: Preserve validated iOS release metadata
        uses: actions/upload-artifact@v7
        with:
          name: ghosttea-ios-release-metadata
          path: |
            apple/GhostteaApp/Resources/Ghosttea-iOS.cdx.json
            apple/GhostteaApp/Resources/THIRD-PARTY-NOTICES.txt
            apple/GhostteaKit/Compatibility/ios-release-resources.lock.json
            apple/GhostteaKit/Compatibility/ios-toolchain.lock.json
            apple/GhostteaKit/Compatibility/ios-app-store.lock.json
            apple/GhostteaKit/Compatibility/TailscaleKit-PrivacyInfo.xcprivacy
            apple/GhostteaKit/Compatibility/app-store-review-notes.md
            apple/GhostteaApp/Resources/PrivacyInfo.xcprivacy
          if-no-files-found: error

  # The root manifest publishes GhostteaKit and the local one builds it; they are
  # mirrors apart from how the native artifact is sourced. Comparing the two
  # package graphs needs a Swift toolchain to evaluate them, so it runs here
  # rather than on the Linux BOM job, where the check would silently skip.
  validate-package-manifests:
    runs-on: macos-26
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      GHOSTTY_DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@1.97.1
        id: toolchain
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      # As in the desktop gates' minimum-rust job: rust-cache keys on every
      # installed toolchain, so the image's own stable goes before it does.
      - name: Keep only the pinned toolchain
        env:
          PINNED: ${{ steps.toolchain.outputs.name }}
        run: |
          test -n "$PINNED" || { echo "dtolnay/rust-toolchain reported no toolchain name" >&2; exit 1; }
          for toolchain in $(rustup toolchain list --quiet); do
            case "$toolchain" in
              "$PINNED"-*) ;;
              *) rustup toolchain uninstall "$toolchain" ;;
            esac
          done

      # Restores the compiled dependencies of build:apple-native's three Apple
      # targets, with the same policy as the desktop gates: pull requests only
      # read the cache, workspace crates always rebuild, and ~/.cargo/bin stays
      # out of it. The publication build never uses this cache.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name != 'pull_request' }}
          cache-bin: false

      - run: npm ci --ignore-scripts
      - run: npm run check:ios-release-toolchain
      - run: npm run check:swiftpm:manifests

      # The pinned libghostty-vt and libssh2/OpenSSL builds take about seven
      # minutes and depend only on their locks, their build scripts and the two
      # Xcode toolchains, so this key covers exactly those. A change to any of
      # them, including a runner image that moves an Xcode or SDK version,
      # misses the cache and rebuilds from source, which is where the Ghostty
      # build checks the toolchain against ghostty.lock.json. The publication
      # build in ghosttea-apple-native-artifact.yml never uses this cache.
      - name: Key the pinned Apple native inputs
        id: apple-inputs-key
        run: |
          set -euo pipefail
          {
            uname -m
            shasum -a 256 \
              native/ghostty.lock.json \
              native/patches/* \
              native/ssh.lock.json \
              apple/GhostteaKit/Compatibility/ios-toolchain.lock.json \
              scripts/ghostty-vt-target.mjs \
              scripts/bootstrap-ghostty-vt-apple.mjs \
              scripts/build-ghostty-vt-apple.mjs \
              scripts/validate-ghostty-vt-xcframework.mjs \
              scripts/bootstrap-ssh-candidate-apple.mjs \
              scripts/build-ssh-candidate-apple.mjs \
              scripts/validate-ssh-candidate-xcframework.mjs
            for developer_dir in "$GHOSTTY_DEVELOPER_DIR" "$DEVELOPER_DIR"; do
              DEVELOPER_DIR="$developer_dir" xcodebuild -version
              for sdk in macosx iphoneos iphonesimulator; do
                DEVELOPER_DIR="$developer_dir" xcrun --sdk "$sdk" --show-sdk-version
              done
            done
          } | tee "$RUNNER_TEMP/apple-native-inputs.txt"
          digest="$(shasum -a 256 "$RUNNER_TEMP/apple-native-inputs.txt" | cut -d' ' -f1)"
          echo "key=apple-native-inputs-v1-$digest" >> "$GITHUB_OUTPUT"

      # Only the outputs build:apple-native reads and the upload below keeps;
      # the Zig and OpenSSL build trees stay out of the cache.
      - name: Restore the pinned Apple native inputs
        id: apple-inputs
        uses: actions/cache@v6
        with:
          key: ${{ steps.apple-inputs-key.outputs.key }}
          path: |
            apple/GhostteaKit/Artifacts/ghostty-vt.xcframework
            apple/GhostteaKit/Artifacts/ghosttea-libssh2-candidate.xcframework
            native/build/ghostty-apple/build-metadata.json
            native/build/ssh-apple/build-metadata.json

      # Build every native input from its reviewed lock, then produce one Rust
      # staticlib for the entire Swift package. This catches native/source drift
      # before a remote artifact exists for the reviewed source. The bootstraps
      # always run: build:apple-native syncs fonts from the Ghostty checkout.
      - run: npm run bootstrap:ghostty-vt:apple
      - if: steps.apple-inputs.outputs.cache-hit != 'true'
        run: npm run build:ghostty-vt:apple
      - run: npm run bootstrap:ssh:apple
      - if: steps.apple-inputs.outputs.cache-hit != 'true'
        run: npm run build:ssh:apple
      - run: npm run build:apple-native

      # A dispatch with `render_evidence` also writes the rendered Apple evidence (the font-parity
      # rows through GhostteaMetalRenderer, as a PNG and its manifest) for a change that moves glyph
      # pixels. Dispatch it on the base and on the candidate, and compare the two artifacts.
      - name: Run the complete local-artifact SwiftPM suite
        env:
          GHOSTTEA_RENDER_EVIDENCE_DIR: ${{ inputs.render_evidence && format('{0}/render-evidence', runner.temp) || '' }}
        run: swift test --disable-sandbox --package-path apple/GhostteaKit

      - name: Preserve the rendered Apple evidence
        if: inputs.render_evidence
        uses: actions/upload-artifact@v7
        with:
          name: ghosttea-render-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/render-evidence
          if-no-files-found: error

      - name: Link every public product against the candidate artifact
        run: npm run test:swiftpm:consumer:local

      - run: npm run package:ghosttea-apple-native
      - run: npm run verify:ghosttea-apple-native-package

      - name: Preserve the reviewed Apple native candidate
        uses: actions/upload-artifact@v7
        with:
          name: ghosttea-apple-native-candidate-${{ github.sha }}
          path: |
            artifacts/apple-native/GhostteaAppleNative.xcframework.zip
            artifacts/apple-native/GhostteaAppleNative.xcframework.zip.json
            native/build/ghosttea-apple-native/metadata.json
            native/build/ghostty-apple/build-metadata.json
            native/build/ssh-apple/build-metadata.json
          if-no-files-found: error
          retention-days: 14
