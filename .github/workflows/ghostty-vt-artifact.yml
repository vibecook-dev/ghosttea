name: Ghostty VT artifact

on:
  workflow_dispatch:
  push:
    tags:
      - "ghostty-vt-*"

permissions:
  actions: read
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Use the locked macOS candidate on tags
        if: github.ref_type == 'tag'
        run: echo "The package job promotes the reviewed workflow artifact."

      - if: github.ref_type != 'tag'
        uses: actions/checkout@v7

      - if: github.ref_type != 'tag'
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - if: github.ref_type != 'tag'
        run: npm ci --ignore-scripts
      - if: github.ref_type != 'tag'
        run: npm run bootstrap:ghostty-vt -- --target=aarch64-apple-darwin
      - if: github.ref_type != 'tag'
        run: npm run build:ghostty-vt -- --target=aarch64-apple-darwin

      - name: Upload unstripped build
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: ghostty-vt-unstripped
          path: native/build/ghostty/aarch64-apple-darwin/install/
          if-no-files-found: error
          retention-days: 1

  package:
    needs: build
    runs-on: macos-26
    env:
      GHOSTTEA_NORMALIZER_DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Download unstripped build
        if: github.ref_type != 'tag'
        uses: actions/download-artifact@v8
        with:
          name: ghostty-vt-unstripped
          path: native/build/ghostty/aarch64-apple-darwin/install/

      - if: github.ref_type != 'tag'
        run: npm run normalize:ghostty-vt -- --target=aarch64-apple-darwin

      - name: Package diagnostic candidate
        if: github.ref_type != 'tag'
        run: npm run package:ghostty-vt -- --target=aarch64-apple-darwin --allow-mismatch

      - name: Resolve locked macOS candidate run
        if: github.ref_type == 'tag'
        id: macos_candidate
        run: |
          run_id="$(node -p "const value = require('./native/ghosttea/crates/ghosttea-vt-sys/artifacts.json').targets['aarch64-apple-darwin'].candidateRunId; if (!Number.isSafeInteger(value) || value <= 0) throw new Error('candidateRunId must be a positive integer'); value")"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Download locked macOS candidate
        if: github.ref_type == 'tag'
        uses: actions/download-artifact@v8
        with:
          name: ghostty-vt-aarch64-apple-darwin
          path: artifacts/ghostty-vt/
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.macos_candidate.outputs.run_id }}

      - name: Verify locked macOS candidate
        if: github.ref_type == 'tag'
        run: node scripts/verify-ghostty-vt-candidate.mjs --target=aarch64-apple-darwin --directory=artifacts/ghostty-vt

      - name: Require the release tag to match the locked artifact
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          expected="$(node -p "require('./native/ghosttea/crates/ghosttea-vt-sys/artifacts.json').targets['aarch64-apple-darwin'].release")"
          test "$RELEASE_TAG" = "$expected"

      - name: Resolve produced artifact paths
        id: ghostty_artifact
        run: |
          filename="$(node scripts/ghostty-vt-artifact-name.mjs --target=aarch64-apple-darwin)"
          echo "path=artifacts/ghostty-vt/$filename" >> "$GITHUB_OUTPUT"
          echo "sbom=artifacts/ghostty-vt/$filename.spdx.json" >> "$GITHUB_OUTPUT"

      - name: Report the macOS manifest entry to lock
        if: github.ref_type != 'tag'
        env:
          CANDIDATE_RUN_ID: ${{ github.run_id }}
        run: |
          filename="$(node scripts/ghostty-vt-artifact-name.mjs --target=aarch64-apple-darwin)"
          {
            echo '### macOS artifact produced by this run'
            echo
            # shellcheck disable=SC2016
            echo 'Copy into `targets["aarch64-apple-darwin"]` of artifacts.json:'
            echo '```json'
            node -e "const fs = require('node:fs'); const value = JSON.parse(fs.readFileSync(process.argv[1], 'utf8')); value.candidateRunId = Number(process.env.CANDIDATE_RUN_ID); console.log(JSON.stringify(value, null, 2));" "artifacts/ghostty-vt/$filename.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Attest bundle provenance
        uses: actions/attest@v4
        with:
          subject-path: ${{ steps.ghostty_artifact.outputs.path }}

      - name: Attest bundle SBOM
        uses: actions/attest@v4
        with:
          subject-path: ${{ steps.ghostty_artifact.outputs.path }}
          sbom-path: ${{ steps.ghostty_artifact.outputs.sbom }}

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: ghostty-vt-aarch64-apple-darwin
          path: artifacts/ghostty-vt/
          if-no-files-found: error

  # Windows builds natively: Zig cannot target the MSVC ABI from the Linux
  # builder image because Microsoft's CRT headers and import libraries are not
  # redistributable. A dispatch builds the authoritative candidate; the tag
  # job promotes those exact immutable workflow-artifact bytes by run ID.
  windows:
    needs: package
    runs-on: windows-2022
    # One candidate per C runtime. Every object in an MSVC link must be compiled
    # for the same runtime, a Rust consumer links the dynamic one unless its
    # target enables crt-static, and ghosttea-vt-sys picks the library built for
    # the runtime its build links.
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-pc-windows-msvc, x86_64-pc-windows-msvc-crt-static]
    env:
      TARGET: ${{ matrix.target }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci --ignore-scripts

      # Zig 0.17 queries Windows system libraries through pkg-config. The
      # runner's Strawberry Perl .BAT shim fails when spawned by Zig; use a
      # native executable and record the tool version in the build recipe.
      - name: Select native pkg-config
        if: github.ref_type != 'tag'
        shell: pwsh
        run: |
          $recipe = (Get-Content native/ghostty.lock.json | ConvertFrom-Json).builder.windowsPkgConfig
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            choco install $recipe.package --version=$($recipe.version) --yes --no-progress
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -eq 3) { throw "pkg-config installation failed" }
            Start-Sleep -Seconds 10
          }
          $exe = Get-ChildItem "$env:ChocolateyInstall/lib/$($recipe.package)" -Recurse -Filter pkg-config.exe | Select-Object -First 1
          if (-not $exe) { throw "native pkg-config executable was not installed" }
          & $exe.FullName --version
          if ($LASTEXITCODE -ne 0) { throw "native pkg-config is not executable" }
          "PKG_CONFIG=$($exe.FullName)" >> $env:GITHUB_ENV

      - name: Build native Windows candidate
        if: github.ref_type != 'tag'
        run: |
          npm run bootstrap:ghostty-vt -- --target="$TARGET"
          npm run build:ghostty-vt -- --target="$TARGET"
          npm run package:ghostty-vt -- --target="$TARGET" --allow-mismatch

      - name: Test Rust consumers with the selected Windows runtime
        if: github.ref_type != 'tag'
        timeout-minutes: 20
        run: |
          export GHOSTTY_VT_PREFIX="$(cygpath -w "$PWD/native/build/ghostty/$TARGET/install")"
          export GHOSTTEA_GHOSTTY_VT_OFFLINE=1
          export GHOSTTEA_FONT_DIR="$(cygpath -w "$PWD/native/build/ghosttea-fonts")"
          if [ "$TARGET" = "x86_64-pc-windows-msvc-crt-static" ]; then
            export RUSTFLAGS="-C target-feature=+crt-static"
          fi
          node scripts/sync-ghosttea-fonts.mjs
          cargo test --locked --target x86_64-pc-windows-msvc -p ghosttea-vt -p ghosttea-text -p ghosttea-core -p ghosttea-ffi
          cargo test --locked --target x86_64-pc-windows-msvc -p ghosttea-ffi --test parity -- --ignored

      - name: Preserve rejected Windows build for diagnosis
        if: failure() && github.ref_type != 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: rejected-${{ matrix.target }}
          path: native/build/ghostty/${{ matrix.target }}/install/
          retention-days: 7
          if-no-files-found: ignore

      - name: Resolve locked Windows candidate run
        if: github.ref_type == 'tag'
        id: windows_candidate
        run: |
          run_id="$(node -p "const value = require('./native/ghosttea/crates/ghosttea-vt-sys/artifacts.json').targets[process.env.TARGET].candidateRunId; if (!Number.isSafeInteger(value) || value <= 0) throw new Error('candidateRunId must be a positive integer'); value")"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Download locked Windows candidate
        if: github.ref_type == 'tag'
        uses: actions/download-artifact@v8
        with:
          name: ghostty-vt-${{ matrix.target }}
          path: artifacts/ghostty-vt/
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.windows_candidate.outputs.run_id }}

      - name: Verify locked Windows candidate
        if: github.ref_type == 'tag'
        run: node scripts/verify-ghostty-vt-candidate.mjs --target="$TARGET" --directory=artifacts/ghostty-vt

      - name: Resolve produced artifact paths
        id: ghostty_artifact
        run: |
          filename="$(node scripts/ghostty-vt-artifact-name.mjs --target="$TARGET")"
          echo "path=artifacts/ghostty-vt/$filename" >> "$GITHUB_OUTPUT"
          echo "sbom=artifacts/ghostty-vt/$filename.spdx.json" >> "$GITHUB_OUTPUT"

      - name: Report the manifest entry to lock
        if: github.ref_type != 'tag'
        env:
          CANDIDATE_RUN_ID: ${{ github.run_id }}
        run: |
          filename="$(node scripts/ghostty-vt-artifact-name.mjs --target="$TARGET")"
          {
            echo '### Windows artifact produced by this run'
            echo
            echo "Copy into \`targets[\"$TARGET\"]\` of artifacts.json:"
            echo '```json'
            node -e "const fs = require('node:fs'); const value = JSON.parse(fs.readFileSync(process.argv[1], 'utf8')); value.candidateRunId = Number(process.env.CANDIDATE_RUN_ID); console.log(JSON.stringify(value, null, 2));" "artifacts/ghostty-vt/$filename.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Attest bundle provenance
        uses: actions/attest@v4
        with:
          subject-path: ${{ steps.ghostty_artifact.outputs.path }}

      - name: Attest bundle SBOM
        uses: actions/attest@v4
        with:
          subject-path: ${{ steps.ghostty_artifact.outputs.path }}
          sbom-path: ${{ steps.ghostty_artifact.outputs.sbom }}

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: ghostty-vt-${{ matrix.target }}
          path: artifacts/ghostty-vt/
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: [package, windows]
    runs-on: ubuntu-24.04
    steps:
      - name: Download locked macOS bundle
        uses: actions/download-artifact@v8
        with:
          name: ghostty-vt-aarch64-apple-darwin
          path: release/aarch64-apple-darwin/

      - name: Download promoted Windows bundle (dynamic C runtime)
        uses: actions/download-artifact@v8
        with:
          name: ghostty-vt-x86_64-pc-windows-msvc
          path: release/x86_64-pc-windows-msvc/

      - name: Download promoted Windows bundle (static C runtime)
        uses: actions/download-artifact@v8
        with:
          name: ghostty-vt-x86_64-pc-windows-msvc-crt-static
          path: release/x86_64-pc-windows-msvc-crt-static/

      # Deliberately no --clobber. Every target bundle is checksum-locked, so a
      # release is immutable and is created only after every platform job passes.
      - name: Create complete release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/aarch64-apple-darwin/* release/x86_64-pc-windows-msvc/* \
            release/x86_64-pc-windows-msvc-crt-static/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
